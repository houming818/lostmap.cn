# ===============================================
# = Hugo Site Config: www.lostmap.cn
# ===============================================
baseURL = "https://www.lostmap.cn/"
uglyURLs = true
disableKinds = ["taxonomy", "term"]
languageCode = "zh-CN"
title = "LostMap"
theme = ["blog-theme", "PaperMod"]
contentDir = "src"
publishDir = "dist"
themesDir = "themes"

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [["$", "$"], ["\\[", "\\]"]]
inline = [["$", "$"], ["\\(", "\\)"]]

[markup.goldmark.renderer]
unsafe = true

[params]
defaultTheme = "dark"
ShowReadingTime = false
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = false
ShowToc = false
    comments = true
mainSections = ["", "skills"]

[params.homeInfoParams]
Title = "LostMap"
Content = "归零与起点的坐标"
